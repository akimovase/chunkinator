[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chunkinator"
version = "0.1.0"
description = "Split a DataFrame into chunks of a desired size without splitting groups of equal values"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2"]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=3",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["chunkinator"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "NPY", "PD", "N"]

[tool.ruff.lint.isort]
known-first-party = ["chunkinator", "helpers"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PD"]

[tool.mypy]
strict = true

[tool.setuptools.package-data]
chunkinator = ["py.typed"]
